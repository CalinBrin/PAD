# Start:  copy .env.example to .env, then: docker compose up --build -d
# Tests:  docker compose run --rm tests
name: pad-lab2

x-service: &service
  restart: unless-stopped
  environment: &common-env
    LOG_FORMAT: ${LOG_FORMAT:-text}

services:
  broker:
    <<: *service
    build: { context: ., dockerfile: deployment/Dockerfile, args: { SERVICE: src/integration-service } }
    environment:
      <<: *common-env
      BROKER_LISTEN: ":7000"
      BROKER_ADMIN: ":8081"
      BROKER_DATA_DIR: /data
      BROKER_QUEUES: orders:inventory,orders:billing
      BROKER_MAX_ATTEMPTS: ${BROKER_MAX_ATTEMPTS:-5}
      BROKER_ACK_TIMEOUT: ${BROKER_ACK_TIMEOUT:-30s}
      BROKER_RETRY_BASE: ${BROKER_RETRY_BASE:-1s}
      BROKER_DEDUP_RETENTION: ${BROKER_DEDUP_RETENTION:-24h}
      BROKER_LOSE_PUBLISH_RESPONSES: ${BROKER_LOSE_PUBLISH_RESPONSES:-0}
    ports: ["7000:7000", "8081:8081"]
    volumes: ["broker-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 3s
      timeout: 2s
      retries: 20

  payment:
    <<: *service
    build: { context: ., dockerfile: deployment/Dockerfile, args: { SERVICE: src/payment-service } }
    environment:
      <<: *common-env
      PAYMENT_LISTEN: ":9000"
      PAYMENT_ADMIN: ":8082"
      PAYMENT_DATA_DIR: /data
      PAYMENT_API_TOKEN: ${PAYMENT_API_TOKEN:?set PAYMENT_API_TOKEN in .env (see .env.example)}
      PAYMENT_LIMIT_CENTS: ${PAYMENT_LIMIT_CENTS:-1000000}
      PAYMENT_LATENCY: ${PAYMENT_LATENCY:-0s}
      PAYMENT_LOSE_RESPONSES: ${PAYMENT_LOSE_RESPONSES:-0}
    ports: ["9000:9000", "8082:8082"]
    volumes: ["payment-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/readyz"]
      interval: 3s
      timeout: 2s
      retries: 20

  order-service:
    <<: *service
    build: { context: ., dockerfile: deployment/Dockerfile, args: { SERVICE: src/order-service } }
    environment:
      <<: *common-env
      ORDER_LISTEN: ":8080"
      ORDER_DATA_DIR: /data
      BROKER_ADDR: broker:7000
      PUBLISH_TIMEOUT: ${PUBLISH_TIMEOUT:-1s}
      PUBLISH_MAX_ATTEMPTS: ${PUBLISH_MAX_ATTEMPTS:-4}
      OUTBOX_INTERVAL: ${OUTBOX_INTERVAL:-2s}
    ports: ["8080:8080"]
    volumes: ["order-data:/data"]
    depends_on:
      broker: { condition: service_healthy }

  inventory:
    <<: *service
    build: { context: ., dockerfile: deployment/Dockerfile, args: { SERVICE: src/consumers/inventory } }
    environment:
      <<: *common-env
      BROKER_ADDR: broker:7000
      CONSUMER_DATA_DIR: /data
      CONSUMER_WORKERS: ${INVENTORY_WORKERS:-2}
      CONSUMER_HEALTH_ADDR: ":8090"
      CRASH_ONCE: ${CRASH_ONCE:-}
    volumes: ["inventory-data:/data"]
    depends_on:
      broker: { condition: service_healthy }

  billing:
    <<: *service
    build: { context: ., dockerfile: deployment/Dockerfile, args: { SERVICE: src/consumers/billing } }
    environment:
      <<: *common-env
      BROKER_ADDR: broker:7000
      PAYMENT_ADDR: payment:9000
      PAYMENT_API_TOKEN: ${PAYMENT_API_TOKEN:?set PAYMENT_API_TOKEN in .env (see .env.example)}
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-800ms}
      PAYMENT_MAX_ATTEMPTS: ${PAYMENT_MAX_ATTEMPTS:-3}
      PAYMENT_LOOKUP_TIMEOUT: ${PAYMENT_LOOKUP_TIMEOUT:-800ms}
      CONSUMER_WORKERS: ${BILLING_WORKERS:-1}
      CONSUMER_HEALTH_ADDR: ":8090"
    # Load balancing: replicas of the same group compete for the messages.
    # They need no shared state: the payment idempotency key prevents double charges.
    deploy:
      replicas: ${BILLING_REPLICAS:-2}
    depends_on:
      broker: { condition: service_healthy }
      payment: { condition: service_healthy }

  tests:
    build: { context: ., dockerfile: deployment/Dockerfile, target: dev }
    command: ["go", "test", "-race", "-count=1", "./..."]
    profiles: ["test"]

volumes:
  broker-data:
  payment-data:
  order-data:
  inventory-data:
